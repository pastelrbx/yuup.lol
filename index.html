    :root {
      --ink: #f6f4ef;
      --bg: #121212;
      --acid: #d7ff2f;
      --danger: #ff3b30;
      --sky: #46d6ff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "IBM Plex Mono", monospace;
      color: var(--ink);
      background-color: var(--bg);
      background-image:
        repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.03) 0 2px, transparent 2px 16px),
        radial-gradient(circle at 12% 18%, rgba(215, 255, 47, 0.2), transparent 24%),
        radial-gradient(circle at 90% 80%, rgba(70, 214, 255, 0.24), transparent 22%);
      display: grid;
      place-items: center;
      padding: 22px;
      overflow-x: hidden;
    }

    .loader {
      width: min(720px, 100%);
      background: #1e1e1e;
      border: 3px solid var(--ink);
      border-radius: 2px;
      padding: clamp(20px, 4vw, 34px);
      box-shadow: 10px 10px 0 var(--danger), -10px -10px 0 var(--sky);
      position: relative;
      overflow: hidden;
      animation: stomp .45s cubic-bezier(.1, .8, .3, 1) both;
    }

    .loader::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(108deg, transparent 0 58%, rgba(215, 255, 47, 0.15) 58% 100%);
      pointer-events: none;
    }

    .loader h1 {
      position: relative;
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(3rem, 12vw, 7rem);
      line-height: .88;
      letter-spacing: .02em;
      color: var(--acid);
      text-shadow: 3px 3px 0 #000;
    }

    .loader p {
      position: relative;
      margin: 10px 0 20px;
      max-width: 42ch;
      font-size: .93rem;
      color: #d9d9d9;
    }

    .loader button {
      position: relative;
      border: 2px solid #000;
      border-radius: 0;
      padding: 12px 16px;
      font: 700 .95rem/1 "IBM Plex Mono", monospace;
      letter-spacing: .08em;
      text-transform: uppercase;
      background: var(--acid);
      color: #000;
      cursor: pointer;
      box-shadow: 6px 6px 0 #000;
      transition: transform .14s ease, box-shadow .14s ease;
    }

    .loader button:hover {
      transform: translate(-2px, -2px);
      box-shadow: 8px 8px 0 #000;
    }

    .loader button:focus-visible {
      outline: 3px solid var(--sky);
      outline-offset: 3px;
    }

    @keyframes stomp {
      from {
        opacity: 0;
        transform: translateY(14px) scale(.96) rotate(-1deg);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1) rotate(0);
      }
    }
  </style>

    function initSecretListener() {
      if (listenerReady) return;
      listenerReady = true;

      document.addEventListener("keydown", (event) => {
        if (event.key !== SECRET[keyIndex]) keyIndex = 0;
        if (event.key === SECRET[keyIndex]) keyIndex += 1;

        if (keyIndex === SECRET.length) {
          remixMode = true;
          setTrack(true);
          keyIndex = 0;
        }
      });

    }

    function setVerifyEmailStatus(text, state) {
      const emailEl = document.getElementById("verify-email");
      if (!emailEl) return;
      emailEl.textContent = text;
      emailEl.classList.remove("ok", "bad");
      if (state === "ok") emailEl.classList.add("ok");

    }

    function normalizeFingerprint(fingerprint) {
      return (fingerprint || "").replace(/[^A-Fa-f0-9]/g, "").toUpperCase();
    }

    function bytesToHex(bytes) {
      return Array.from(bytes || [])
        .map((value) => value.toString(16).padStart(2, "0"))
        .join("")
        .toUpperCase();
    }

    function extractFingerprintFromMessage(cleartextMessage) {
      const packets = cleartextMessage?.signature?.packets || [];
      for (const packet of packets) {
        const rawFingerprint = packet?.issuerFingerprint || packet?.issuerKeyFingerprint || packet?.fingerprint;
        if (rawFingerprint instanceof Uint8Array && rawFingerprint.length > 0) {
          return bytesToHex(rawFingerprint);
        }
        if (typeof rawFingerprint === "string" && rawFingerprint.length > 0) {
          return normalizeFingerprint(rawFingerprint);
        }
      }
      return "";
    }

    function extractKeyIdFromMessage(cleartextMessage) {
      const keyIDs = cleartextMessage?.getSigningKeyIDs ? cleartextMessage.getSigningKeyIDs() : [];
      const firstKeyID = keyIDs[0];
      if (!firstKeyID || typeof firstKeyID.toHex !== "function") return "";
      return normalizeFingerprint(firstKeyID.toHex());
    }

    function extractEmailsFromUserIDs(userIDs) {
      return userIDs
        .map((userID) => {
          const match = userID.match(/<([^>]+)>/);
          return (match ? match[1] : "").toLowerCase();
        })
        .filter(Boolean);
    }

    function initSignedTaglineWidget() {
      const codeEl = document.getElementById("signed-tagline");
      const verifyButton = document.getElementById("verify-tagline");
      if (!codeEl || !verifyButton) return;

      if (TAGLINE_PGP_CLEARSIGNED_MESSAGES.length === 0) {
        codeEl.textContent = "No signed taglines configured.";
        verifyButton.disabled = true;
        setVerifyStatus("No Taglines", "bad");
        return;
      }

      const randomIndex = Math.floor(Math.random() * TAGLINE_PGP_CLEARSIGNED_MESSAGES.length);
      currentSignedTagline = TAGLINE_PGP_CLEARSIGNED_MESSAGES[randomIndex];
      codeEl.textContent = currentSignedTagline;
      setVerifyStatus("Unverified", "");
      setVerifyEmailStatus("unknown ❌", "bad");

      verifyButton.addEventListener("click", verifyCurrentSignedTagline);
    }

    async function verifyCurrentSignedTagline() {
      if (!currentSignedTagline) {
        setVerifyStatus("Nothing To Verify", "bad");
        return;
      }

      if (!window.openpgp) {
        setVerifyStatus("Verifier Not Loaded", "bad");
        return;
      }

      const cleartextMessage = await openpgp.readCleartextMessage({ cleartextMessage: currentSignedTagline });
      const normalizedFingerprint = normalizeFingerprint(extractFingerprintFromMessage(cleartextMessage));
      const signerKeyId = extractKeyIdFromMessage(cleartextMessage);
      if (!normalizedFingerprint && !signerKeyId) {
        setVerifyStatus("Missing Fingerprint", "bad");
        setVerifyEmailStatus("unknown ❌", "bad");
        return;
      }

      try {
        const keyLookupPath = normalizedFingerprint
          ? `by-fingerprint/${normalizedFingerprint}`
          : `by-keyid/${signerKeyId}`;
        const keyResponse = await fetch(`https://keys.openpgp.org/vks/v1/${keyLookupPath}`);
        if (!keyResponse.ok) {
          throw new Error("Failed to fetch key");
        }

        const armoredKey = await keyResponse.text();
        const verificationKey = await openpgp.readKey({ armoredKey });
        const verificationResult = await openpgp.verify({
          message: cleartextMessage,
          verificationKeys: verificationKey
        });

        const signature = verificationResult.signatures[0];
        await signature.verified;
        const emails = extractEmailsFromUserIDs(verificationKey.getUserIDs ? verificationKey.getUserIDs() : []);
        const approvedEmailSet = new Set(APPROVED_SIGNER_EMAILS.map((email) => email.toLowerCase()));
        const approvedSignerEmail = emails.find((email) => approvedEmailSet.has(email));

        if (approvedSignerEmail) {
          setVerifyStatus("Verified", "ok");
          setVerifyEmailStatus(`${approvedSignerEmail} ✅`, "ok");
          return;
        }

        const linkedEmail = emails[0] || "unknown";
        setVerifyStatus("Unapproved Email", "bad");
        setVerifyEmailStatus(`${linkedEmail} ❌`, "bad");
      } catch (_error) {
        setVerifyStatus("Invalid Signature", "bad");
        setVerifyEmailStatus("unknown ❌", "bad");
      }
    }

    function loadSite() {
      fetch("source.html")
        .then((res) => res.text())
        .then((html) => {
          const app = document.getElementById("app");
          app.className = "";
          app.innerHTML = html;
          initSecretListener();
          setTrack(remixMode);
          initSignedTaglineWidget();
        });
    }

    document.getElementById("open-site").addEventListener("click", loadSite);

    if (typeof navigator.getAutoplayPolicy === "function" &&
      navigator.getAutoplayPolicy("mediaelement") === "allowed") {
      loadSite();
    }
